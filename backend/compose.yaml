# AI 模拟面试系统 - 本地开发依赖
# 只启动 PostgreSQL 与 Redis，应用本身在宿主机用 uvicorn 跑（便于热重载调试）
#
# 端口说明：本机 6379 已被其他项目的 Redis 占用，5432 也可能冲突，
# 因此统一使用 5433(PostgreSQL) / 6380(Redis)，避免影响已有服务。
#
# Redis 必须用 redis-stack 镜像：LangGraph 的 Redis Checkpointer
# 依赖 RedisJSON + RediSearch 模块，普通 redis:7.x 镜像会直接报错。

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-interview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview_dev_pw
      POSTGRES_DB: interview
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: ai-interview-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    command: ["redis-stack-server", "--appendonly", "yes", "--save", "900", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
